<script type="text/javascript">
    const buttonCertificado = document.querySelector("#btnCertificado");

            window.location.href = redirectUrl;
        }); 
    };

    if (buttonGovBr != null) {
        buttonGovBr.addEventListener("click", function(e) {

            window.location.href = redirectUrl;
        }); 
    };

    
     (function () {
        const storageKey = "loginAccordionState";
        const hasModelErrors = false;

        function setCollapse(selector, isOpen) {
            const $el = $(selector);
            if (!$el.length) return;
            $el.collapse(isOpen ? "show" : "hide");
        }

        function syncDividerState() {
            const isOpen = $("#collapseOutrasFormas").hasClass("show");
            $(".divider-accordion-toggle").attr("aria-expanded", isOpen ? "true" : "false");
        }

        function saveState() {
            const state = {
                outras: $("#collapseOutrasFormas").hasClass("show"),
                certificado: $("#collapseCertificado").hasClass("show"),
                senhaWeb: $("#collapseSenhaWeb").hasClass("show")
            };
            sessionStorage.setItem(storageKey, JSON.stringify(state));
        }

        $(function () {
            const savedRaw = sessionStorage.getItem(storageKey);
            const saved = savedRaw ? JSON.parse(savedRaw) : null;

            const state = saved ?? {
                outras: hasModelErrors,
                certificado: false,
                senhaWeb: true
            };

            setCollapse("#collapseOutrasFormas", !!state.outras);
            setCollapse("#collapseCertificado", !!state.certificado);
            setCollapse("#collapseSenhaWeb", !!state.senhaWeb);

            syncDividerState();

            $("#collapseOutrasFormas, #collapseCertificado, #collapseSenhaWeb")
                .on("shown.bs.collapse hidden.bs.collapse", function () {
                    saveState();
                    syncDividerState();
                });
        });
    })();

</script>

    <script>
        $(document).ready(function () {

            let moduloCpfCnpj = (function () {
                return {
                    aplicaMascaraCpfCnpj() {
                        var cpfOuCnpj =  document.querySelector('.cpfOuCnpj');
                        if (cpfOuCnpj) {
                            cpfOuCnpj.addEventListener('input', function (e) {
                                let valor = e.target.value.toUpperCase().replace(/[^0-9A-Z]/g, ""); // permite números e letras

                                if (valor.length <= 11 && /^[0-9]+$/.test(valor)) {
                                    // CPF → só números
                                    let x = valor.match(/(\d{0,3})(\d{0,3})(\d{0,3})(\d{0,2})/);
                                    e.target.value = !x[2] ? x[1] :
                                        x[1] + "." + x[2] +
                                        (x[3] ? "." + x[3] : "") +
                                        (x[4] ? "-" + x[4] : "");
                                } else {
                                    // CNPJ alfanumérico (DV só numérico)
                                    let x = valor.match(/([0-9A-Z]{0,2})([0-9A-Z]{0,3})([0-9A-Z]{0,3})([0-9A-Z]{0,4})([0-9]{0,2})/);
                                    e.target.value = !x[2] ? x[1] :
                                        x[1] + "." + x[2] +
                                        (x[3] ? "." + x[3] : "") +
                                        (x[4] ? "/" + x[4] : "") +
                                        (x[5] ? "-" + x[5] : "");
                                }
                            });
                        }
                    },
                };
            })();

            moduloCpfCnpj.aplicaMascaraCpfCnpj();

            var button = $('.button'),
                spinner = '<span class="spinner"></span>';

            button.click(function (e) {
                if ($(this).addClass('loading')) {
                    $(this)
                        .addClass('loading')
                        .html(spinner)
                        .disabled = 'disabled';
                    hideKeyboard($('#password'));
                }
                else {
                    preventDefault();
                }
            });

            function hideKeyboard() {
                let element = $("img");
                element.attr('readonly', 'readonly'); // Force keyboard to hide on input field.
                element.attr('disabled', 'true'); // Force keyboard to hide on textarea field.
                setTimeout(function () {
                    //actually close the keyboard
                    element.blur();
                    element.removeAttr('readonly'); // Remove readonly attribute after keyboard is hidden.
                    element.removeAttr('disabled');
                }, 100);
            }

        });

    </script>
